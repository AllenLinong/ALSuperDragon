name: ALSuperDragon
version: '${version}'
main: al.dragon.ALDragon
api-version: '26.1.2'
description: '四档末影龙、可配置技能、龙蛋概率与参战奖励。'
commands:
  alsuperdragon:
    description: ALSuperDragon 管理员指令
    aliases: [aldragon]
    usage: '/<command> reload | summon [random|scout|storm|abyss|sovereign]'
    permission: alsuperdragon.reload;alsuperdragon.summon
permissions:
  alsuperdragon.reload:
    description: 允许重载配置
    default: op
  alsuperdragon.summon:
    description: 允许在末地启动末影龙复活仪式
    default: op
