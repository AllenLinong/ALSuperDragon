# 配置格式版本，由插件维护，请勿手动修改。
config-version: 1
# 游戏内提示和血条语言：zh_CN（默认）或 en_US。修改后执行插件重载指令；本文件注释始终为中文。
language: zh_CN
# 难度只影响插件技能，不改原版世界难度、血量、龙蛋概率或召唤物。
difficulty:
  # easy：技能伤害 ×0.75、冷却 ×1.3；normal：均为 ×1；hard：伤害 ×1.25、冷却 ×0.8。
  preset: normal
  # 额外技能伤害倍率（0–10），与难度及龙的伤害倍率相乘。设为 0 只保留技能效果。
  skill-damage-multiplier: 1.0
# 原版首杀不受这些设置影响；后续按末地世界共享保底。
egg:
  # 初始出蛋率（0–100%），加成后不超过 100%。
  base-chance-percent: 20.0
  # 连续 N−1 次未出蛋后，第 N 次必出。0 关闭保底；出蛋后清零。
  pity-kills: 10
  # 实际血量倍率每比 1.0 高出整整一倍，增加这么多百分点；小数按比例。
  bonus-per-health-multiplier: 5.0
  # 伤害倍率每超过 1.5 门槛满 1.0 倍，增加这么多百分点；小数按比例。难度预设不参与计算。
  bonus-per-damage-multiplier: 5.0
  # 血量倍率必须严格大于此值才触发额外加成；等于门槛不加。
  high-health-threshold: 5.0
  # 达标后额外增加的百分点；填 0 关闭。总掉率不超过 100%。
  high-health-bonus-percent: 10.0
dragon:
  # 默认也强化原版首龙；设为 false 则只强化复活龙。首杀龙蛋规则不变。
  include-first-dragon: true
  # 血量倍率，0.1–5.12；原版 200 点生命，实际最多 1024 点。
  health:
    # 关闭随机时使用这个倍率。
    fixed: 2.0
    # 每条龙独立抽取一次；重启不会重抽。
    random: true
    # 随机区间下限。
    min: 1.5
    # 随机区间上限。
    max: 3.0
  # 龙的伤害倍率，0.1–100；包括可归因给龙的插件技能伤害。
  damage:
    # 关闭随机时使用这个倍率。
    fixed: 1.5
    # 伤害随机可独立于血量开启。
    random: true
    # 随机区间下限。
    min: 1.0
    # 随机区间上限。
    max: 2.5
  # 主龙连续未受伤后，玩家下一次有效命中必定暴击；所有玩家和龙的各部位共享计时。
  idle-critical:
    enabled: true
    idle-seconds: 30.0
    multiplier: 3.0
  # 强化主龙及各部位每次伤害事件的上限，占主龙最大生命值的百分比；暴击后限幅，包含爆炸。0 关闭。
  max-damage-per-hit-percent: 20.0
# 出场和死亡标题以祭坛为中心，群龙预警发给参战玩家；死亡音效以龙为中心，仅同一世界。
notifications:
  # 出场和死亡标题的距离，0–128 格；填 0 关闭这两类标题。
  title-radius: 50
  # 标题完全显示的时间，0–10 秒；填 0 关闭上述标题及群龙预警标题。
  title-seconds: 1
  # 标题淡出时间，0–10 秒；填 0 则直接消失。
  title-fade-out-seconds: 2
  # 死亡音效距离，0–128 格；不恢复原版全服广播。
  death-sound-radius: 128
# 以下伤害单位为生命值（2 点 = 1 颗心），预警单位为秒，半径单位为格。
skills:
  # 关闭所有插件技能，不影响掉率、倍率、Boss 血条或提示。
  enabled: true
  # 祭坛周围的水平参战距离（16–128 格）。没有参战玩家时不运行技能。
  arena-radius: 112
  # 常规技能的基础间隔（4–3600 秒），再应用难度冷却倍率；阶段转场不必等待此间隔。
  interval-seconds: 14
  # 关键技能完成后的休整时间（0–30 秒）。
  major-recovery-seconds: 3.0
  # 强化火球：锁定位置预警，随后投射并造成范围伤害。
  fireball:
    enabled: true
    # 血量低于或等于这个百分比后加入技能池。
    health-percent: 66.67
    damage: 8.0
    radius: 4.0
    warning-seconds: 1.25
  # 冲击波：向外扩散，同一次施放最多命中每位玩家一次。
  shockwave:
    enabled: true
    damage: 6.0
    radius: 16.0
    warning-seconds: 1.25
  # 蓄力激光：被方块阻挡；radius 是光束命中半径，不是长度。
  laser:
    enabled: true
    health-percent: 33.33
    damage: 10.0
    radius: 1.45
    warning-seconds: 1.5
  # 俯冲打击：默认前期单次，进入阈值后变为连击。
  dive:
    enabled: true
    # 连击血量阈值（百分比），不是俯冲解锁阈值。
    health-percent: 66.67
    # 每组连击次数（1–6）。
    combo-count: 3
    damage: 9.0
    radius: 5.0
    warning-seconds: 1.25
  # 群龙俯冲：主龙血量降至 75%、50%、25% 时各释放一次，每次五只小龙，不破坏地形。
  dragon-rush:
    enabled: true
    # 默认用原版显示实体组成小龙；设为 true 改用原版大小的末影龙实体。
    real-dragons: false
    warning-seconds: 2.0
    # 小龙生成后的基础盘旋时间（秒）；随后错开俯冲，各自锁定最近的参战玩家。
    orbit-seconds: 3.0
    # 单次爆炸的基础伤害和范围；伤害受难度及主龙倍率影响。
    damage: 6.0
    radius: 3.5
  # 浮空阵：锁定目标脚下，命中时浮空 3 秒并获得 8 秒缓降。
  levitation-field:
    enabled: true
    health-percent: 85.0
    cooldown-seconds: 28.0
    warning-seconds: 1.5
    damage: 0.0
    radius: 5.0
  # 龙息喷涌：预警结束后造成范围伤害，并留下 160 tick 的伤害龙息云。
  breath-eruption:
    enabled: true
    health-percent: 65.0
    cooldown-seconds: 35.0
    warning-seconds: 1.75
    damage: 4.0
    radius: 4.0
  # 水晶裂爆：最多三个爆点；范围重叠也只判定一次，不破坏地形。
  crystal-burst:
    enabled: true
    health-percent: 40.0
    cooldown-seconds: 40.0
    warning-seconds: 2.0
    damage: 5.0
    radius: 3.0
  # 衔空：血量降至门槛后可用，独立冷却；冲到目标身边，叼起后升高再松口。
  sky-bite:
    enabled: true
    health-percent: 75.0
    cooldown-seconds: 45.0
    warning-seconds: 1.0
    # 每秒基础伤害，受难度和主龙伤害倍率影响；不含摔落伤害。
    damage: 1.0
    # 龙头到玩家的捕捉距离，以及咬住后相对抓取点的上升高度。
    radius: 3.0
    lift-height: 20.0
  # 追踪激光：追踪一人半秒前的位置，可横向走位或用方块遮挡，不破坏地形。
  tracking-laser:
    enabled: true
    health-percent: 30.0
    cooldown-seconds: 30.0
    warning-seconds: 1.0
    duration-seconds: 5.0
    # 每半秒检测一次光束命中；下方是命中时的基础伤害。
    damage: 2.0
    range: 64.0
  # 怒吼：剩余血量首次降至 80%、60%、40%、20% 时各触发一次，让附近末影人分头攻击参战玩家。
  ender-roar:
    enabled: true
    range: 100.0
  # 龙蛋位水晶：剩余血量降到门槛时，每条龙触发一次；玩家可打掉水晶解除倒计时。
  podium-crystal:
    enabled: true
    health-percent: 55.0
    wave-fuse-seconds: 10.0
    # 涟漪和残留龙息的水平半径，仅影响生存/冒险玩家。
    blast-radius: 50.0
    # 涟漪每 tick 扩散的格数。
    wave-speed: 0.5
    # 未举盾挡下涟漪时的基础伤害；挡住时固定扣除当前生命的 90%。
    blast-damage: 99999.0
    breath-seconds: 20.0
    # 超时爆炸后的龙息每秒伤害，单位为生命值点数。
    breath-damage: 2.0
  # 终局冲击：每条龙最多一次；可离开范围，原版不死图腾可正常救命。
  finale:
    enabled: true
    health-percent: 10.0
    damage: 36.0
    radius: 20.0
    warning-seconds: 4.0
  # 是否显示剩余塔顶水晶，并在全部摧毁时触发奖励提示与冲击波。
  crystals:
    enabled: true
  # 水晶全部摧毁后每条龙触发一次幻翼增援；无人参战或战斗结束时清理。
  phantoms:
    enabled: true
    # 最多生成数量（1–6），且不会超过参战玩家数 +2。
    count: 3
    # 最多存活秒数（5–120）。
    lifetime-seconds: 30
  # 飞行粒子轨迹，可关闭以减少视觉干扰。
  trail:
    enabled: true
  # 默认关闭，避免与客户端原版音乐叠加。
  music:
    enabled: false
    # 可填原版音效 ID，也可填客户端资源包注册的音效 ID。
    sound: minecraft:music.dragon
